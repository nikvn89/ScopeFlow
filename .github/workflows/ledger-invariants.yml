name: Scope Ledger Invariants

on:
  push:
    paths:
      - 'contracts/ScopeFlow.py'
      - 'tests/ledger_model.test.py'
      - 'tests/scopeflow_contract.test.py'
      - 'tests/run-ledger.mjs'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/ledger-invariants.yml'
  pull_request:
    paths:
      - 'contracts/ScopeFlow.py'
      - 'tests/ledger_model.test.py'
      - 'tests/scopeflow_contract.test.py'
      - 'tests/run-ledger.mjs'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'

jobs:
  ledger-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run verify
